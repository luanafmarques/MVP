# Alternativa ao Supabase: PostgreSQL em contêiner.
# Uso: docker compose up -d   (e não crie o arquivo .env, ou aponte DB_URL para a porta 5433)
services:
  postgres:
    image: postgres:17
    container_name: pontomorto-db
    environment:
      POSTGRES_DB: pontomorto
      POSTGRES_USER: pontomorto
      POSTGRES_PASSWORD: pontomorto
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pontomorto-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontomorto -d pontomorto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pontomorto-dados:
