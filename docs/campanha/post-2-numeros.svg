<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t2">
  <title id="t2">Ponto Morto: 161 minutos parados em 3 roteiros de um único dia</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&amp;family=Barlow:wght@500;700&amp;display=swap');
    .placa { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; }
    .texto { font-family: 'Barlow', Arial, sans-serif; }
  </style>
  <rect width="1080" height="1080" fill="#F5C200"/>
  <!-- placa de sinalização: borda escura -->
  <rect x="40" y="40" width="1000" height="1000" rx="48" fill="none" stroke="#1F2326" stroke-width="14"/>

  <text x="100" y="190" class="texto" font-size="42" fill="#1F2326" font-weight="700">Em um único dia, 3 roteiros somaram</text>
  <text x="90" y="530" class="placa" font-size="400" fill="#1F2326" letter-spacing="-8">161</text>
  <text x="500" y="530" class="placa" font-size="150" fill="#1F2326">min</text>
  <text x="100" y="620" class="texto" font-size="46" fill="#1F2326">parados. Ninguém sabia onde.</text>

  <!-- três indicadores -->
  <g transform="translate(100 700)">
    <rect width="270" height="190" rx="18" fill="#1F2326"/>
    <text x="24" y="82" class="placa" font-size="76" fill="#F5C200">15,6%</text>
    <text x="24" y="126" class="texto" font-size="24" fill="#F1F2F0">da jornada do</text>
    <text x="24" y="158" class="texto" font-size="24" fill="#F1F2F0">roteiro A</text>
  </g>
  <g transform="translate(405 700)">
    <rect width="270" height="190" rx="18" fill="#1F2326"/>
    <text x="24" y="82" class="placa" font-size="76" fill="#F5C200">31%</text>
    <text x="24" y="126" class="texto" font-size="24" fill="#F1F2F0">do tempo parado</text>
    <text x="24" y="158" class="texto" font-size="24" fill="#F1F2F0">em 1 endereço</text>
  </g>
  <g transform="translate(710 700)">
    <rect width="270" height="190" rx="18" fill="#1F2326"/>
    <text x="24" y="82" class="placa" font-size="76" fill="#F5C200">54 min</text>
    <text x="24" y="126" class="texto" font-size="24" fill="#F1F2F0">parados, em média,</text>
    <text x="24" y="158" class="texto" font-size="24" fill="#F1F2F0">por roteiro</text>
  </g>

  <text x="100" y="975" class="placa" font-size="44" fill="#1F2326" letter-spacing="2">PONTO MORTO · TESTE GRÁTIS POR 30 DIAS</text>
</svg>
