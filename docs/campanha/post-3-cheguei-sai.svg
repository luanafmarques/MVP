<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t3">
  <title id="t3">Ponto Morto: o motorista só toca Cheguei e Saí</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&amp;family=Barlow:wght@500;700&amp;display=swap');
    .placa { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; }
    .texto { font-family: 'Barlow', Arial, sans-serif; }
  </style>
  <rect width="1080" height="1080" fill="#F2F3F1"/>
  <rect y="0" width="1080" height="120" fill="#2B2F33"/>
  <line x1="0" y1="120" x2="1080" y2="120" stroke="#F5C200" stroke-width="10" stroke-dasharray="70 40"/>
  <text x="80" y="80" class="placa" font-size="52" fill="#F1F2F0" letter-spacing="3">PONTO MORTO</text>

  <text x="80" y="270" class="placa" font-size="110" fill="#1F2326">CHEGUEI. SAÍ.</text>
  <text x="80" y="380" class="placa" font-size="110" fill="#17803F">PRONTO.</text>
  <text x="80" y="450" class="texto" font-size="34" fill="#474E54">O motorista não digita nada: dois toques por parada.</text>

  <!-- celular -->
  <g transform="translate(560 500)">
    <rect width="400" height="560" rx="46" fill="#1F2326"/>
    <rect x="18" y="18" width="364" height="524" rx="30" fill="#FFFFFF"/>
    <text x="44" y="80" class="texto" font-size="22" fill="#676F76">Próximo ponto · 2º</text>
    <text x="44" y="118" class="texto" font-size="30" font-weight="700" fill="#1F2326">Rua Peru, 55</text>
    <rect x="40" y="160" width="152" height="150" rx="18" fill="#F5C200" stroke="#1F2326" stroke-width="4"/>
    <text x="116" y="248" class="placa" font-size="40" fill="#1F2326" text-anchor="middle">CHEGUEI</text>
    <rect x="208" y="160" width="152" height="150" rx="18" fill="#17803F"/>
    <text x="284" y="248" class="placa" font-size="40" fill="#FFFFFF" text-anchor="middle">SAÍ</text>
    <rect x="40" y="350" width="320" height="32" rx="16" fill="#2B2F33"/>
    <line x1="56" y1="366" x2="344" y2="366" stroke="#F5C200" stroke-width="3" stroke-dasharray="16 12"/>
    <circle cx="80" cy="366" r="10" fill="#17803F" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="180" cy="366" r="18" fill="#F5C200" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="270" cy="366" r="10" fill="#FFFFFF" stroke="#B9BEB8" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="44" y="440" class="texto" font-size="22" fill="#474E54">Chegada 08:25 · Saída 08:40</text>
    <text x="44" y="480" class="texto" font-size="26" font-weight="700" fill="#1F2326">15 min parado</text>
  </g>

  <g class="texto" font-size="32" fill="#1F2326">
    <text x="80" y="600">✓ Funciona no celular</text>
    <text x="80" y="660">✓ Horário gravado na hora</text>
    <text x="80" y="720">✓ Correções ficam registradas</text>
    <text x="80" y="780">✓ Sem rastrear em tempo real</text>
  </g>
  <text x="80" y="960" class="texto" font-size="30" font-weight="700" fill="#1F2326">Teste grátis por 30 dias</text>
  <text x="80" y="1004" class="texto" font-size="26" fill="#474E54">Link na bio</text>
</svg>
