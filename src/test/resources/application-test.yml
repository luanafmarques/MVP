# Testes automatizados: banco H2 em memória, no modo compatível com PostgreSQL,
# com as mesmas migrações Flyway. Não precisa de internet nem de banco instalado.
spring:
  datasource:
    url: jdbc:h2:mem:pontomorto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  thymeleaf:
    cache: true

pontomorto:
  dados-exemplo:
    habilitado: true
    meses-historico: 2
  geocodificacao:
    habilitado: false
  osrm:
    habilitado: false
