<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Campos de coordenadas com busca automática pelo endereço e mapa para ajuste manual (RF03). -->
<fieldset th:fragment="coordenadas(campoEndereco)" class="largo" data-geocodificacao th:attr="data-base=@{/},data-endereco=${campoEndereco}"
          data-lat="latitude" data-lon="longitude">
    <legend>Localização no mapa</legend>
    <p class="pequeno muted">Clique em “Buscar coordenadas” para achar o endereço automaticamente. Se não achar, ou se o ponto
        ficar no lugar errado, digite as coordenadas, clique no mapa ou arraste o marcador. Deixe vazio para o sistema buscar ao salvar.</p>
    <div class="formulario">
        <div class="campo"><label for="latitude">Latitude</label><input id="latitude" type="number" step="0.000001" min="-90" max="90" th:field="*{latitude}"></div>
        <div class="campo"><label for="longitude">Longitude</label><input id="longitude" type="number" step="0.000001" min="-180" max="180" th:field="*{longitude}"></div>
        <div class="campo" style="justify-content:flex-end"><button type="button" class="botao botao-secundario" data-buscar>Buscar coordenadas</button></div>
    </div>
    <p class="pequeno" data-mensagem aria-live="polite"></p>
    <div class="mapa" aria-label="Mapa para ajustar o ponto"></div>
</fieldset>
</body>
</html>
