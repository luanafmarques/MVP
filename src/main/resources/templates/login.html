<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Entrar')}"></head>
<body>
<header th:replace="~{fragmentos/base :: topo('login')}"></header>
<main id="conteudo" class="pagina">
    <div class="caixa-login">
        <div class="cartao">
            <h1>Entrar</h1>
            <div class="aviso aviso-erro" role="alert" th:if="${param.erro}">Usuário ou senha inválidos.</div>
            <div class="aviso aviso-sucesso" role="status" th:if="${param.saiu}">Você saiu do sistema.</div>
            <form th:action="@{/login}" method="post" class="formulario" style="grid-template-columns:1fr">
                <div class="campo">
                    <label for="login">E-mail</label>
                    <input id="login" name="login" type="email" required autofocus autocomplete="username">
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" name="senha" type="password" required autocomplete="current-password">
                </div>
                <button class="botao" type="submit">Entrar</button>
            </form>
        </div>
        <div class="cartao contas-exemplo">
            <h2>Contas de exemplo</h2>
            <p>Administrador: <code>admin@pontomorto.com.br</code> / <code>admin123</code></p>
            <p>Gerente: <code>gerente@pontomorto.com.br</code> / <code>gerente123</code></p>
            <p>Motoristas: <code>joao@</code>, <code>maria@</code> ou <code>pedro@pontomorto.com.br</code> / <code>motorista123</code></p>
            <p class="muted pequeno">Troque essas senhas antes de usar com dados reais.</p>
        </div>
    </div>
</main>
<footer th:replace="~{fragmentos/base :: rodape}"></footer>
</body>
</html>
